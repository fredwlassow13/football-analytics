services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: football
      POSTGRES_PASSWORD: football_local
      POSTGRES_DB: football
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football -d football"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://football:football_local@db:5432/football
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://football:football_local@db:5432/football
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
