[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "football-analytics"
version = "0.1.0"
description = "Plataforma modular de inteligência de futebol"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
