name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'
  MPLBACKEND: Agg

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - run: python -m pip install -c constraints.txt -e '.[dev,visualization]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - name: Validate complete test partition
        run: python scripts/ci_test_suites.py

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build -t football-analytics:${{ github.sha }} .
      - name: Export built image
        run: docker save football-analytics:${{ github.sha }} -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: build-image-${{ github.sha }}
          path: image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  tests:
    name: Tests / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [analytics, ingestion, integrations, scripts, visualization, api]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: football
          POSTGRES_PASSWORD: football_local
          POSTGRES_DB: football_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U football -d football_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://football:football_local@localhost:5432/football_test
      TEST_DATABASE_URL: postgresql+psycopg://football:football_local@localhost:5432/football_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - run: python -m pip install -c constraints.txt -e '.[dev,visualization]'
      - name: Check migration round trip
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Run suite with no skips
        run: python scripts/ci_test_suites.py --suite '${{ matrix.suite }}'
      - name: Upload test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.suite }}
          path: test-results/*.xml
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Package
    needs: [lint, build, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-image-${{ github.sha }}
      - name: Compress image and generate checksum
        run: |
          mkdir -p package
          gzip -c image.tar > package/football-analytics-${{ github.sha }}.tar.gz
          cd package
          sha256sum ./*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ github.sha }}
          path: package/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  # Placeholders: no deployment, health probe or external notification is executed.
  deploy:
    name: Deploy (not configured)
    needs: package
    if: ${{ vars.CI_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'TODO configure deployment target and credentials'

  smoke-test:
    name: Smoke test (not configured)
    needs: deploy
    if: ${{ vars.CI_SMOKE_TEST_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'TODO configure post-deployment health checks'

  notify:
    name: Notify (not configured)
    needs: [lint, build, tests, package, deploy, smoke-test]
    if: ${{ vars.CI_NOTIFY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'TODO configure notification destination'
